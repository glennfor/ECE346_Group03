safety_filter_node:
  ros__parameters:
    command_mode: servo
    odom_topic: /slam_pose
    human_control_topic: /human_control
    filtered_control_topic: /control
    static_obstacles_topic: /Obstacles/Static
    dynamic_obstacles_topic: /Obstacles/Dynamic
    control_rate_hz: 30.0

    wheelbase_m: 0.257
    truck_radius_m: 0.13
    truck_length_m: 0.40
    a_min: -5.0
    a_max: 5.0
    omega_min: -6.0
    omega_max: 6.0
    delta_min: -0.35
    delta_max: 0.35
    v_min: 0.0
    v_max: 5.0

    dt: 0.0333333333              # Prediction timestep; matches the 30 Hz simulator.
    horizon_H: 45                 # Number of prediction steps used by the backup-CBF rollout.
    r_safe_lane: 0.05             # Extra lane-boundary clearance after subtracting truck radius.
    r_safe_obs: 0.20              # Extra clearance around static obstacles.
    r_safe_traf: 0.25             # Extra clearance around moving traffic obstacles.
    r_safe_kin: 0.0               # Extra buffer inside actuator/speed limits.
    lane_guard_margin_m: 0.25     # Immediate lane override threshold before the CBF/QP logic.
    lane_recovery_speed_mps: 0.25 # Max speed target allowed during lane recovery.
    lane_recovery_accel_gain: 4.0 # Gain used to cap acceleration toward lane recovery speed.
    obstacle_radius_default: 0.14 # Radius used when obstacle messages do not provide one.
    obstacle_memory_ttl_s: 1.0    # Time to keep last-seen obstacles after detections drop.
    obstacle_memory_growth: 0.5   # Radius growth per second for stale obstacle detections.

    K_e: 1.0                      # Cross-track error gain for steering back to lane center.
    K_p: 5.0                      # Steering-rate gain toward the desired recentering angle.
    v_eps: 0.3                    # Small speed offset to avoid overreacting near zero speed.
    lambda_cbf: 0.7               # CBF aggressiveness; larger values demand faster h recovery.
    qp_R_accel: 1.0               # QP penalty on changing human acceleration input.
    qp_R_omega: 1.0               # QP penalty on changing human steering-rate input.
    grad_eps: 0.001               # Finite-difference step for estimating the CBF gradient.
    exact_safety_check: false     # Re-simulate candidate control and reject it if h gets worse.
    hysteresis_cycles: 5          # Keep override active briefly after intervention starts.
    passthrough_tolerance: 0.001  # Difference below this is treated as unchanged human input.
    stale_timeout_s: 0.5          # Fall back if odom or human command is older than this.
    recovery_h_improvement: 0.001 # Minimum h improvement needed to allow unsafe-state recovery.
    lane_change_cost: 1.0         # Penalty for selecting a lane-change route from Lanelet2.
    lane_context_rebuild_distance_m: 0.25 # Rebuild lane geometry after this position change.
    lane_context_rebuild_yaw_rad: 0.35    # Rebuild lane geometry after this heading change.

simulator_node:
  ros__parameters:
    control_topic: /control
    odom_topic: /slam_pose
    pub_rate: 30
    init_x: 2.0
    init_y: 0.3
    init_yaw: 0.0
    reset_service: /simulation/reset

traffic_simulation_node:
  ros__parameters:
    ~num_dyn_obs: 1
    ~num_static_obs: 1
    ~static_obs_size: 0.2
    static_obs_topic: /Obstacles/Static
    dyn_obs_topic: /Obstacles/Dynamic
    pub_rate: 30
    static_obs_location: ''
    reset_obstacle_service: /simulation/reset_static_obstacles

joy_to_servo_node:
  ros__parameters:
    joy_topic: /joy
    human_control_topic: /human_control
    publish_rate_hz: 30.0
    throttle_axis: 1
    steer_axis: 0
    steer_axis_alt: 3
    deadman_button: 4
    throttle_scale: 0.6
    steer_scale: 0.35
    throttle_offset: 0.0
    invert_throttle: false
    invert_steer: false

safety_viz_node:
  ros__parameters:
    backup_traj_topic: /safety/backup_traj
    value_topic: /safety/value
    override_topic: /safety/override
    marker_topic: /safety/markers

