safety_filter_node:
  ros__parameters:
    command_mode: servo
    odom_topic: /slam_pose
    human_control_topic: /human_control
    filtered_control_topic: /control
    static_obstacles_topic: /Obstacles/Static
    dynamic_obstacles_topic: /Obstacles/Dynamic
    control_rate_hz: 30.0

    wheelbase_m: 0.257
    truck_radius_m: 0.13
    truck_length_m: 0.40
    a_min: -5.0
    a_max: 5.0
    omega_min: -6.0
    omega_max: 6.0
    delta_min: -0.35
    delta_max: 0.35
    v_min: 0.0
    v_max: 5.0

    dt: 0.0333333333
    horizon_H: 30
    r_safe_lane: 0.01
    r_safe_obs: 0.05
    r_safe_traf: 0.10
    r_safe_kin: 0.0
    obstacle_radius_default: 0.14
    obstacle_memory_ttl_s: 1.0
    obstacle_memory_growth: 0.5

    K_e: 1.0
    K_p: 5.0
    v_eps: 0.3
    lambda_cbf: 0.4
    qp_R_accel: 1.0
    qp_R_omega: 1.0
    grad_eps: 0.001
    exact_safety_check: true
    hysteresis_cycles: 5
    passthrough_tolerance: 0.001
    stale_timeout_s: 0.5
    lane_change_cost: 1.0
    lane_context_rebuild_distance_m: 0.25
    lane_context_rebuild_yaw_rad: 0.35

simulator_node:
  ros__parameters:
    control_topic: /control
    odom_topic: /slam_pose
    pub_rate: 30
    init_x: 2.0
    init_y: 0.3
    init_yaw: 0.0
    reset_service: /simulation/reset

traffic_simulation_node:
  ros__parameters:
    ~num_dyn_obs: 1
    ~num_static_obs: 1
    ~static_obs_size: 0.2
    static_obs_topic: /Obstacles/Static
    dyn_obs_topic: /Obstacles/Dynamic
    pub_rate: 30
    static_obs_location: ''
    reset_obstacle_service: /simulation/reset_static_obstacles

joy_to_servo_node:
  ros__parameters:
    joy_topic: /joy
    human_control_topic: /human_control
    publish_rate_hz: 30.0
    throttle_axis: 1
    steer_axis: 0
    deadman_button: 4
    throttle_scale: 1.0
    steer_scale: 0.35
    throttle_offset: 0.0
    invert_throttle: false
    invert_steer: false

safety_viz_node:
  ros__parameters:
    backup_traj_topic: /safety/backup_traj
    value_topic: /safety/value
    override_topic: /safety/override
    marker_topic: /safety/markers

