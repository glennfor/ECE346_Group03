# CBF Safety Filter — Simulation Parameters (simplified heuristic implementation)
#
# Launch:             ros2 launch racecar_ece346 cbf_sim_launch.py
# Passthrough (off):  ros2 launch racecar_ece346 cbf_sim_launch.py enable_qp:=false
# Toggle at runtime:  ros2 param set /safety_filter_qp_node enable_qp true

backup_planner_node:
  ros__parameters:
    odom_topic: /slam_pose
    map_file: ""                      # auto-loaded from racecar_routing share
    control_rate_hz: 20.0

    wheelbase_m: 0.257
    truck_radius_m: 0.13
    truck_length_m: 0.40

    a_min: -5.0
    a_max: 5.0
    omega_min: -6.0
    omega_max: 6.0
    delta_min: -0.35
    delta_max: 0.35
    v_min: 0.0
    v_max: 5.0
    dt: 0.05
    horizon_H: 10

    K_e: 2.5
    K_p: 6.0
    v_eps: 0.3
    backup_omega_lpf_tau_s: 0.08

    r_safe_obs: 0.03

    filtered_control_topic: /control

    obstacle_radius_default: 0.14
    obstacle_memory_ttl_s: 1.0
    obstacle_memory_growth: 0.5

    lane_change_cost: 1.0
    lane_allow_lane_change: true
    route_hysteresis_rad: 0.25
    lane_context_rebuild_distance_m: 0.5
    lane_context_rebuild_yaw_rad: 0.5

safety_monitor_node:
  ros__parameters:
    odom_topic: /slam_pose
    static_obstacles_topic: /Obstacles/Static
    dynamic_obstacles_topic: /Obstacles/Dynamic
    control_rate_hz: 20.0

    wheelbase_m: 0.257
    truck_radius_m: 0.13
    truck_length_m: 0.40
    a_min: -5.0
    a_max: 5.0
    omega_min: -6.0
    omega_max: 6.0
    delta_min: -0.35
    delta_max: 0.35
    v_min: 0.0
    v_max: 5.0
    dt: 0.05
    horizon_H: 20
    horizon_H_max: 25

    r_safe_lane: 0.02
    r_safe_obs: 0.12
    r_safe_traf: 0.18

    obstacle_radius_default: 0.14
    obstacle_memory_ttl_s: 1.0
    obstacle_memory_growth: 0.5

    stale_timeout_s: 0.5

    filtered_control_topic: /control
    fallback_h_safe: 1000.0

    lane_change_cost: 1.0
    lane_allow_lane_change: true
    route_hysteresis_rad: 0.25
    lane_context_rebuild_distance_m: 0.5
    lane_context_rebuild_yaw_rad: 0.5

safety_filter_qp_node:
  ros__parameters:
    odom_topic: /slam_pose
    human_control_topic: /human_control
    filtered_control_topic: /control
    control_rate_hz: 20.0

    wheelbase_m: 0.257
    truck_radius_m: 0.13
    truck_length_m: 0.40
    a_min: -5.0
    a_max: 5.0
    omega_min: -6.0
    omega_max: 6.0
    delta_min: -0.35
    delta_max: 0.35
    v_min: 0.0
    v_max: 5.0
    dt: 0.05

    # throttle_cap_margin: distance (m) below which steering blend + throttle cap kicks in.
    # Wider = more warning distance before full backup fires.
    throttle_cap_margin: 0.08
    steer_blend_lpf_tau_s: 0.25
    max_delta_rate_rad_s: 2.0

    # enable_qp=false → passthrough (joystick drives directly).
    enable_qp: true

    stale_timeout_s: 0.5

# ---- Infrastructure nodes (not CBF filter itself) ----

joy_node:
  ros__parameters:
    dev: /dev/input/js0
    deadzone: 0.05
    autorepeat_rate: 30.0

safety_viz_node:
  ros__parameters:
    backup_traj_topic: /safety/backup_traj
    value_topic: /safety/value
    override_topic: /safety/override
    marker_topic: /safety/markers

simulator_node:
  ros__parameters:
    control_topic: /control
    odom_topic: /slam_pose
    pub_rate: 30
    init_x: 2.0
    init_y: 0.3
    init_yaw: 0.0
    reset_service: /simulation/reset

traffic_simulation_node:
  ros__parameters:
    ~num_dyn_obs: 1
    ~num_static_obs: 1
    ~static_obs_size: 0.2
    static_obs_topic: /Obstacles/Static
    dyn_obs_topic: /Obstacles/Dynamic
    pub_rate: 30
    static_obs_location: ''
    reset_obstacle_service: /simulation/reset_static_obstacles

joy_to_servo_node:
  ros__parameters:
    joy_topic: /joy
    human_control_topic: /human_control
    publish_rate_hz: 30.0
    throttle_axis: 1
    steer_axis: 0
    steer_axis_alt: 3
    deadman_button: 4
    throttle_scale: 0.5
    steer_scale: 0.35
    throttle_offset: 0.0
    invert_throttle: false
    invert_steer: false
