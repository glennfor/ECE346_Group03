# CBF Safety Filter — Real Truck Parameters (heuristic monitor + blend filter)
#
# Launch: ros2 launch racecar_ece346 cbf_real_launch.py
#
# CHECKLIST before first hardware run:
#   1. Verify wheelbase_m matches the physical truck.
#   2. Start with enable_qp=false and drive slowly to confirm /slam_pose is live.
#   3. Confirm /safety/value: ros2 topic echo /safety/value
#   4. Set enable_qp=true for the first safety-critical run at low speed.
#   5. Measure stopping time T_stop, then set horizon_H ≈ ceil(1.5*T_stop/dt).

backup_planner_node:
  ros__parameters:
    odom_topic: /slam_pose
    map_file: ""
    control_rate_hz: 20.0

    wheelbase_m: 0.257
    truck_radius_m: 0.13
    truck_length_m: 0.40

    a_min: -3.0
    a_max: 1.5
    omega_min: -3.0
    omega_max: 3.0
    delta_min: -0.35
    delta_max: 0.35
    v_min: 0.0
    v_max: 2.0

    dt: 0.05
    horizon_H: 30

    K_e: 2.5
    K_p: 6.0
    v_eps: 0.3
    backup_omega_lpf_tau_s: 0.12

    r_safe_lane: 0.08
    r_safe_obs: 0.08
    r_safe_traf: 0.12

    filtered_control_topic: /control
    human_control_topic: /human_control
    static_obstacles_topic: /Obstacles/Static
    dynamic_obstacles_topic: /Obstacles/Dynamic

    obstacle_radius_default: 0.06
    obstacle_memory_ttl_s: 1.0
    obstacle_memory_growth: 0.5

    lane_change_cost: 1.0
    lane_allow_lane_change: false
    route_hysteresis_rad: 0.25
    lane_context_rebuild_distance_m: 0.5
    lane_context_rebuild_yaw_rad: 0.5

    throttle_cap_margin: 0.12
    steer_blend_lpf_tau_s: 0.10
    fallback_h_safe: 1000.0

