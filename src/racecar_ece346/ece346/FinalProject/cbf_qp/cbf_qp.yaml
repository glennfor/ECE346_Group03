topics:
  command_mode: ackermann
  teleop_topic: /teleop
  drive_topic: /drive
  odom_topic: /slam_pose
  static_obs_topic: /Obstacles/Static
  dynamic_obstacles_topic: /Obstacles/Dynamic
  routing_path_topic: /Routing/Path
  map_file: ""

vehicle:
  wheelbase_m: 0.324
  truck_radius_m: 0.274
  truck_length_m: 0.46
  a_min: -3 #-4.0
  a_max: 1.5 #1.5 #3.0
  omega_min: -4.0
  omega_max: 4.0
  delta_min: -0.35
  delta_max: 0.35
  v_min: 0.0
  v_max: 0.5 #1.0

prediction:
  dt: 0.05
  horizon_H: 30
  publish_rate: 30.0

margins:
  r_safe_lane: 0.05
  r_safe_obs: 0.05
  r_safe_traf: 0.10
  r_safe_kin: 0.02
  lane_guard_margin_m: 0.1 #0.05
  obstacle_guard_margin_m: 0.35
  traffic_guard_margin_m: 0.45
  forward_obstacle_width_m: 0.45
  forward_obstacle_distance_m: 1.4
  forward_obstacle_brake_margin_m: 0.25
  obstacle_radius_default: 0.12
  obstacle_memory_ttl_s: 1.0
  obstacle_memory_growth: 0.5

backup_policy:
  lane_recovery_speed_mps: 0.65
  lane_recovery_accel_gain: 5.0
  K_e: 1.0 #2.2
  K_p: 5.0 #7.0
  v_eps: 0.3

qp:
  lambda_cbf: 1.4 #0.4
  qp_R_accel: 0.1 #1.0
  qp_R_omega: 0.1 #1.0
  grad_eps: 0.1 #0.001
  exact_safety_check: true
  hysteresis_cycles: 10 #5
  passthrough_tolerance: 0.01 #0.001
  stale_timeout_s: 0.5
  recovery_h_improvement: 0.001

diagnostics:
  publish_debug: true

lane_context:
  lane_change_cost: 1.0
  lane_allow_lane_change: true
  route_hysteresis_rad: 0.25
  lane_context_rebuild_distance_m: 0.25
  lane_context_rebuild_yaw_rad: 0.35

