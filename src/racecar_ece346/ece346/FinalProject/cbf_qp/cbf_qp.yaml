topics:
  teleop_topic: /teleop
  drive_topic: /drive
  odom_topic: /slam_pose
  static_obs_topic: /Obstacles/Static
  routing_path_topic: /Routing/Path

timing:
  publish_rate: 30.0
  teleop_timeout_sec: 0.5
  odom_timeout_sec: 0.5
  obstacle_timeout_sec: 1.0
  path_timeout_sec: 5.0

vehicle:
  wheelbase: 0.324
  max_speed: 1.0
  min_speed: 0.0
  max_steering_angle: 0.34
  max_decel: 5.0
  response_delay_sec: 0.12

prediction:
  horizon_sec: 2.0
  dt: 0.1
  min_projection_speed: 0.25

robustness:
  vehicle_radius: 0.24
  obstacle_radius_buffer: 0.12
  lane_margin: 0.18
  localization_buffer: 0.08
  stopping_buffer: 0.10
  cbf_gamma: 0.55
  require_path_for_lane_filter: false

qp:
  speed_samples: [1.0, 0.85, 0.65, 0.45, 0.25, 0.0]
  steering_offsets: [0.0, -0.08, 0.08, -0.16, 0.16, -0.26, 0.26, -0.34, 0.34]
  speed_weight: 1.0
  steering_weight: 1.25
  brake_weight: 0.25
  lane_violation_weight: 700.0
  obstacle_violation_weight: 1200.0
  progress_weight: 0.03

failsafe:
  stale_odom_speed: 0.0
  stale_odom_steering: 0.0
  no_solution_speed: 0.0
  no_solution_keep_steering: true
  allow_reverse: false

diagnostics:
  log_period_sec: 0.5

