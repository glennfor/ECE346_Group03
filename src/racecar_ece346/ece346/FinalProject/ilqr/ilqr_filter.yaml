topics:
  teleop_topic: /teleop
  drive_topic: /drive
  odom_topic: /slam_pose
  static_obs_topic: /Obstacles/Static
  routing_path_topic: /Routing/Path

timing:
  publish_rate: 30.0
  teleop_timeout_sec: 0.5
  odom_timeout_sec: 0.5
  obstacle_timeout_sec: 1.0
  path_timeout_sec: 5.0
  log_period_sec: 0.5

vehicle:
  wheelbase: 0.324
  max_speed: 1.0
  min_speed: 0.0
  max_steering_angle: 0.34
  max_decel: 5.0
  max_accel: 2.5
  max_steering_rate: 4.0
  response_delay_sec: 0.10
  allow_reverse: false

prediction:
  horizon_sec: 2.0
  dt: 0.10
  min_projection_speed: 0.35

robustness:
  vehicle_radius: 0.24
  obstacle_radius_buffer: 0.12
  lane_margin: 0.16
  localization_buffer: 0.08
  stopping_buffer: 0.12
  require_path_for_lane_filter: false
  soft_margin: 0.10
  hard_margin: 0.00

ilqr_qp:
  ilqr_iterations: 4
  speed_scales: [1.0, 0.85, 0.65, 0.45, 0.25, 0.0]
  steering_offsets: [0.0, -0.08, 0.08, -0.16, 0.16, -0.26, 0.26, -0.34, 0.34]
  recovery_steering_offsets: [-0.34, -0.24, -0.14, 0.0, 0.14, 0.24, 0.34]
  speed_weight: 1.0
  steering_weight: 1.3
  brake_weight: 0.25
  steering_rate_weight: 0.04
  lane_violation_weight: 900.0
  obstacle_violation_weight: 1400.0
  progress_weight: 0.04
  heading_weight: 0.15

failsafe:
  no_solution_speed: 0.0
  no_solution_keep_steering: true
  stale_odom_speed: 0.0
  stale_odom_steering: 0.0
